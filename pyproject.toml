[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-qa-bot"
version = "0.3.0"
description = "基于 RAG 的传感器知识库中文问答机器人（DeepSeek + LangChain + FAISS）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "F1NeM0t1oN" }]
keywords = ["rag", "sensor", "qa", "langchain", "deepseek", "faiss"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "unstructured>=0.12.0",
    "markdown>=3.5.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/SunDaySi1ence7853/sensor-qa-bot"
Repository = "https://github.com/SunDaySi1ence7853/sensor-qa-bot"

[project.scripts]
sensor-qa       = "src.cli:main_chat"
sensor-qa-build = "src.cli:main_build"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "logs*", "vectorstore*", "knowledge_base*"]

# ------------------------------------------------------------
# pytest（全项目唯一配置源）
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ------------------------------------------------------------
# coverage：注意 cli.py 不再 omit（评审点名的问题）
# ------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]